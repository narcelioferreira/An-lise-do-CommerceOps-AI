# Ambiente local.
#   docker compose up -d db                      # só o banco
#   docker compose up -d                         # banco + API
#   docker compose --profile local-llm up -d     # + Ollama (LLM e embeddings locais)
#
# Langfuse: o projeto usa o Langfuse Cloud (chaves no .env), inclusive na etapa de Kubernetes.
# Self-hosted (Postgres + ClickHouse + Redis + MinIO) continua opcional e fora deste compose.

services:
  db:
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    environment:
      POSTGRES_DB: commerceops
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      APP_DB_USER: ${APP_DB_USER:?defina no .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d commerceops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/commerceops
      # Dentro do contêiner, "localhost" é a própria API: o Ollama é alcançado pelo nome do serviço.
      # Só aponta para ele se o .env ligou os embeddings; vazio no .env = vazio aqui (só busca lexical).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:+http://ollama:11434/v1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # Contêiner sem privilégios extras e com sistema de arquivos somente leitura (OWASP AST06)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ollama:
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  ollama:
