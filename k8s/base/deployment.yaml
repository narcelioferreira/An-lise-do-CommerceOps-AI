apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerceops-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false  # a aplicação não fala com a API do Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: commerceops-ai
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: commerceops-config
            - secretRef:
                name: commerceops-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          # Probes nunca dependem do LLM nem do Langfuse: instabilidade deles não pode tirar pods do ar
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
