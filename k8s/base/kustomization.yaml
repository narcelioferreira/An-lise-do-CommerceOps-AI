# Base comum. Segredos NÃO ficam aqui: crie o Secret `commerceops-secrets` fora do git (ver k8s/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: commerceops-ai
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - httproute.yaml
configMapGenerator:
  - name: commerceops-config
    literals:
      - ENVIRONMENT=development
      - LLM_BASE_URL=https://api.groq.com/openai/v1
      - LLM_MODEL=openai/gpt-oss-120b
      - LANGFUSE_BASE_URL=https://cloud.langfuse.com
      - RATE_LIMIT_PER_MINUTE=30
      # O pod só recebe tráfego do gateway (networkpolicy.yaml), então o X-Forwarded-For dele é
      # confiável: é o IP real do cliente que o limitador de requisições usa.
      - FORWARDED_ALLOW_IPS=*
