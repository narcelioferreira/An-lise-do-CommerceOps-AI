# Gateway API (o ingress-nginx foi descontinuado). O Gateway `commerceops` é do cluster, no namespace
# gateway-system; nele ficam TLS e o limite global de requisições, que é específico de cada
# implementação (o limitador da aplicação vale por pod).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: commerceops-api
spec:
  parentRefs:
    - name: commerceops
      namespace: gateway-system
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1/ }
      backendRefs:
        - name: commerceops-api
          port: 80
