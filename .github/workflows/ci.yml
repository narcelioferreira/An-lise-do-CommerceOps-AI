name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Base de conhecimento coerente e catálogo atualizado
        run: uv run python scripts/render_policies.py --check
      - name: Testes unitários
        run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commerceops
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d commerceops"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci_admin
      PGPASSWORD: ci_admin
      PGDATABASE: commerceops
      POSTGRES_USER: ci_admin
      POSTGRES_DB: commerceops
      APP_DB_USER: ci_app
      APP_DB_PASSWORD: ci_app
      ADMIN_DATABASE_URL: postgresql://ci_admin:ci_admin@localhost:5432/commerceops
      DATABASE_URL: postgresql://ci_app:ci_app@localhost:5432/commerceops
      ORDER_ID_HMAC_KEY: chave-de-teste
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Aplica db/init como o entrypoint do Postgres faria
        run: |
          psql -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          sh db/init/02_app_role.sh
      - name: Testes de integração
        run: uv run pytest -m integration

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t commerceops-ai:ci .
