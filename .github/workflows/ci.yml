name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions fixadas por SHA de commit: tags podem ser movidas (OWASP AST02/AST07). O Dependabot atualiza.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint (inclui regras de segurança do bandit)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Vulnerabilidades conhecidas nas dependências
        run: uv run pip-audit --skip-editable
      - name: Base de conhecimento coerente e catálogo atualizado
        run: uv run python scripts/render_policies.py --check
      - name: Testes unitários
        run: uv run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      db:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: commerceops
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d commerceops"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci_admin
      PGPASSWORD: ci_admin
      PGDATABASE: commerceops
      POSTGRES_USER: ci_admin
      POSTGRES_DB: commerceops
      APP_DB_USER: ci_app
      APP_DB_PASSWORD: ci_app
      ADMIN_DATABASE_URL: postgresql://ci_admin:ci_admin@localhost:5432/commerceops
      DATABASE_URL: postgresql://ci_app:ci_app@localhost:5432/commerceops
      ORDER_ID_HMAC_KEY: chave-de-teste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Aplica db/init como o entrypoint do Postgres faria
        run: |
          psql -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          sh db/init/02_app_role.sh
      - name: Testes de integração
        run: uv run pytest -m integration

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build da imagem
        run: docker build -t commerceops-ai:ci .

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifests renderizam e seguem os schemas (inclui o HTTPRoute da Gateway API)
        run: |
          for env in dev staging; do
            docker run --rm -v "$PWD/k8s:/k8s:ro" \
              registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4 \
              build "/k8s/overlays/$env" |
            docker run --rm -i \
              ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
              -strict -summary -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          done
