[project]
name = "commerceops-ai"
version = "0.1.0"
description = "Atendimento e análise operacional para e-commerce com LLM, RAG e observabilidade (ambiente simulado sobre o dataset Olist)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "langfuse>=5,<6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerceops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: precisa de Postgres com pgvector (ADMIN_DATABASE_URL e DATABASE_URL)"]
addopts = "-m 'not integration'"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
